<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06182B">
  <title>TUTB — App da Torcida</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../shared/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/brand.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="topo">
      <button class="topo__voltar" id="voltar" aria-label="Voltar" hidden>&#8592;</button>
      <a href="#/" class="topo__marca"><img src="../shared/emblem.svg" alt="" width="30" height="35"><span>TUTB</span></a>
      <a href="#/carrinho" class="topo__carrinho" aria-label="Carrinho">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </a>
    </header>

    <main id="tela" tabindex="-1"></main>

    <nav class="abas" aria-label="Navegação principal">
      <a href="#/" data-aba="inicio"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
      <a href="#/jogos" data-aba="jogos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/></svg>Jogos</a>
      <a href="#/carteirinha" data-aba="carteirinha" class="abas__centro"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h4M6 16c.6-1.4 1.8-2 3-2s2.4.6 3 2"/></svg>Carteira</a>
      <a href="#/loja" data-aba="loja"><svg viewBox="0 0 24 24"><path d="M8 4 4 7l2 4 2-1v10h8V10l2 1 2-4-4-3c-.5 1.5-2 2.5-4 2.5S8.5 5.5 8 4z"/></svg>Loja</a>
      <a href="#/mais" data-aba="mais"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Mais</a>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
